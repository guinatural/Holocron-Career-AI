version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: holocron-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: holocron
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: holocron-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ChromaDB (Vector Store for RAG)
  chromadb:
    image: chromadb/chroma:latest
    container_name: holocron-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "true"
      CHROMA_SERVER_HOSTNAME: chromadb
      CHROMA_SERVER_HTTP_PORT: 8000

  # API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: holocron-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/holocron
      - REDIS_URL=redis://redis:6379
      - CHROMA_DB_PATH=http://chromadb:8000
      - ENVIRONMENT=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/requirements.txt:/app/requirements.txt

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  # Web Service (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: holocron-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
